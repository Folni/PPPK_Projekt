name: Bird Pipeline

on:
  workflow_dispatch:
    inputs:
      species_filter:
        description: 'Fuzzy species name filter (leave empty for all species)'
        required: false
        default: ''
      fuzzy_threshold:
        description: 'Fuzzy match threshold (0-100)'
        required: false
        default: '70'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      minio:
        image: minio/minio
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install snakemake pandas matplotlib

      - name: Wait for services
        run: sleep 20

      - name: Seed Kafka test messages
        run: python scripts/step2_kafka.py --seed

      - name: Run pipeline
        run: |
          snakemake --cores 1 --config \
            species_filter="${{ github.event.inputs.species_filter }}" \
            fuzzy_threshold="${{ github.event.inputs.fuzzy_threshold }}"

      - name: Upload Report and Visualization
        uses: actions/upload-artifact@v4
        with:
          name: bird-pipeline-results
          path: |
            output/bird_report.csv
            output/bird_report.png

name: Bird Pipeline

on:
  workflow_dispatch:
    inputs:
      species_filter:
        description: 'Fuzzy species name filter (leave empty for all species)'
        required: false
        default: ''
      fuzzy_threshold:
        description: 'Fuzzy match threshold (0-100)'
        required: false
        default: '70'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MinIO
        run: |
          docker run -d --name minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data --console-address ":9001"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO ready"; break
            fi
            sleep 3
          done

      - name: Start Zookeeper
        run: |
          docker run -d --name zookeeper --network host \
            -e ZOOKEEPER_CLIENT_PORT=2181 \
            -e ZOOKEEPER_TICK_TIME=2000 \
            confluentinc/cp-zookeeper:7.5.0
          sleep 15

      - name: Start Kafka
        run: |
          docker run -d --name kafka --network host \
            -e KAFKA_BROKER_ID=1 \
            -e KAFKA_ZOOKEEPER_CONNECT=localhost:2181 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true \
            -e KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT \
            confluentinc/cp-kafka:7.5.0
          sleep 15

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r BirdPipeline/requirements.txt

      - name: Seed Kafka test messages
        run: python BirdPipeline/scripts/step2_kafka.py --seed

      - name: Run pipeline
        working-directory: BirdPipeline
        run: |
          snakemake --cores 1 --config \
            species_filter="${{ github.event.inputs.species_filter }}" \
            fuzzy_threshold="${{ github.event.inputs.fuzzy_threshold }}"

      - name: Upload Report and Visualization
        uses: actions/upload-artifact@v4
        with:
          name: bird-pipeline-results
          path: |
            BirdPipeline/output/bird_report.csv
            BirdPipeline/output/bird_report.png
